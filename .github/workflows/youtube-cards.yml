name: GitHub Readme YouTube Cards
on:
  schedule:
    # Runs every hour, on the hour
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Allow the job to commit to the repository
    permissions:
      contents: write
    # Run the GitHub Readme YouTube Cards action
    steps:
      - id: cards
        uses: DenverCoder1/github-readme-youtube-cards@main
        with:
          # The action declares channel_id optional with an empty default, so an
          # unset secret silently queries nothing. The id is public, so fall back
          # to it rather than depending on the secret being present.
          channel_id: ${{ secrets.YOUTUBE_CHANNEL_ID || 'UC2AMoUO4AwOk69rFFliDfKQ' }}
          lang: en
          comment_tag_name: YOUTUBE-CARDS
          youtube_api_key: ${{ secrets.YOUTUBE_API_KEY }}
          max_videos: 6
          base_url: https://ytcards.demolab.com/
          card_width: 250
          border_radius: 5
          background_color: "#0d1117"
          title_color: "#ffffff"
          stats_color: "#dedede"
          theme_context_light: '{ "background_color": "#ffffff", "title_color": "#24292f", "stats_color": "#57606a" }'
          theme_context_dark: '{ "background_color": "#0d1117", "title_color": "#ffffff", "stats_color": "#dedede" }'
          max_title_lines: 2
          show_duration: true 
          author_name: GitHub Actions
          author_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "docs(readme): Update YouTube cards"
          readme_path: README.md
          output_only: false
          output_type: html

      # The action reports success even when the API returns nothing, which is
      # how this section silently emptied itself on 2026-09-08 and stayed blank.
      # Turn that into a visible failure.
      - name: Verify cards were actually generated
        if: always() && steps.cards.outcome == 'success'
        env:
          CARDS: ${{ steps.cards.outputs.markdown }}
        run: |
          if [ -z "${CARDS//[[:space:]]/}" ]; then
            echo "::error::The action produced no cards. YOUTUBE_API_KEY is most likely expired, restricted to the wrong API, or out of quota; YOUTUBE_CHANNEL_ID may also be unset."
            exit 1
          fi
          echo "Generated $(printf '%s' "$CARDS" | grep -c '<a href' || true) card(s)."
