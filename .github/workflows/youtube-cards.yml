name: GitHub Readme YouTube Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# Shared with the stats job: both commit to README.md.
concurrency:
  group: readme-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the API key is present
        id: guard
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::notice::YOUTUBE_API_KEY is not set - skipping. Add it under Settings > Secrets and variables > Actions."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Was DenverCoder1/github-readme-youtube-cards. That action reads its
      # video list from youtube.com/feeds/videos.xml, which YouTube retired -
      # it now 404s for every channel, so the action quietly wrote an empty
      # section from 2026-09-08 on. The card images below still come from
      # ytcards.demolab.com; only the data source moved to the Data API.
      - name: Build cards from the YouTube Data API
        id: cards
        if: steps.guard.outputs.configured == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID || 'UC2AMoUO4AwOk69rFFliDfKQ' }}
          README_PATH: README.md
          MAX_VIDEOS: "6"
          LANG_CODE: en
          CARD_WIDTH: "250"
          BORDER_RADIUS: "5"
          MAX_TITLE_LINES: "2"
        run: python3 .github/scripts/youtube_cards.py

      - name: Commit the refreshed cards
        if: steps.cards.outputs.changed == 'true'
        env:
          GIT_AUTHOR_NAME: GitHub Actions
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: GitHub Actions
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add README.md
          git commit -m "docs(readme): Update YouTube cards"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push attempt ${attempt} failed, retrying"
            sleep 5
          done
          echo "::error::Could not push the updated README after 3 attempts."
          exit 1
